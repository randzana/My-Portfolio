<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="preload" as="image" href="/portrait.jpg"
    imagesrcset="/portrait-sm.jpg 500w, /portrait.jpg 1000w"
    imagesizes="(max-width: 900px) 340px, (max-width: 1400px) 30vw, 420px" fetchpriority="high" />
  <title>Rand Zana | Software Engineer · Videographer · Content Creator</title>
  <meta name="description"
    content="Portfolio of Rand Zana - Software Engineer, Videographer, Marketing Manager & Content Creator." />
  <meta name="theme-color" content="#f6f6f3" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0a0a0b" media="(prefers-color-scheme: dark)" />
  <!-- Apply the saved (or system) theme before first paint so the page never flashes the wrong one. -->
  <script>
    (function () {
      var theme;
      try { theme = localStorage.getItem('theme'); } catch (e) { /* storage blocked */ }
      if (theme !== 'light' && theme !== 'dark') {
        theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
